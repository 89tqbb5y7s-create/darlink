name: Temporary 2010 O Corpus Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: temporary-2010-o-corpus
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary corpus code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml trafilatura

      - name: Fetch verified 2010 replacement articles
        run: python scripts/fetch_moonlight_selected.py

      - name: Upload replacement data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-2010-selected
          path: out_moon/**
          if-no-files-found: warn
          retention-days: 1
