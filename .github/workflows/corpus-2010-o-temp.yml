name: Temporary 2010 O Corpus Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: temporary-2010-o-corpus
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary corpus code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Build and validate dynamic corpus
        run: python scripts/corpus_2010_o_temp_v3.py

      - name: Upload corpus data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2010-o-corpus-data-v3
          path: out/**
          if-no-files-found: warn
          retention-days: 1
