name: Build 2013 O Corpus

on:
  pull_request:
    branches: [main]
    types: [reopened]
    paths:
      - '.github/workflows/build-corpus-2013.yml'
      - 'tools/build_corpus_2013_v5.py'
      - 'tools/build_corpus_2013_v7.py'
      - 'tools/build_corpus_2013_v8.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-corpus-2013-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q beautifulsoup4 lxml opencc-python-reimplemented markdown python-docx openpyxl pypdf
      - name: Build final expanded corpus from fixed snapshots
        id: corpus
        shell: bash
        run: |
          set +e
          python tools/build_corpus_2013_v8.py > /tmp/2013_O_build.log 2>&1
          rc=$?
          mkdir -p build/2013_O
          cp /tmp/2013_O_build.log build/2013_O/build.log
          echo "$rc" > build/2013_O/exit_code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload corpus and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2013_O_corpus
          path: build/2013_O
          if-no-files-found: error
          retention-days: 7
      - name: Enforce QA result
        if: always()
        run: |
          rc='${{ steps.corpus.outputs.exit_code }}'
          test -n "$rc" || rc=1
          exit "$rc"
