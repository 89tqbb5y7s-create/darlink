name: Build 2013 O Corpus

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build-corpus-2013.yml'
      - 'tools/build_corpus_2013.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-corpus-2013-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml opencc-python-reimplemented markdown
      - name: Build corpus and retain diagnostics
        shell: bash
        run: |
          # Build on the temporary branch so diagnostics can be persisted safely.
          mkdir -p build/2013_O
          set +e
          python tools/build_corpus_2013.py > build/2013_O/build.log 2>&1
          rc=$?
          echo "$rc" > build/2013_O/exit_code.txt
          zip -qr build/2013_O_debug.zip build/2013_O
          git config user.name "corpus-build-bot"
          git config user.email "corpus-build-bot@users.noreply.github.com"
          git add -f build/2013_O build/2013_O_debug.zip
          git commit -m "Store 2013 corpus build diagnostics" || true
          git push origin HEAD:tmp-corpus-2013-build
          exit $rc
