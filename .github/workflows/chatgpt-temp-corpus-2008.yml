name: ChatGPT Temporary 2008 Corpus Build

on:
  push:
    branches:
      - chatgpt-temp-corpus-2008
    paths:
      - scripts/chatgpt_corpus_2008.py
      - .github/workflows/chatgpt-temp-corpus-2008.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml trafilatura

      - name: Build and validate corpus
        run: python scripts/chatgpt_corpus_2008.py

      - name: Upload corpus payload
        uses: actions/upload-artifact@v4
        with:
          name: 2008-O-corpus-payload
          path: 2008_O_payload.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
