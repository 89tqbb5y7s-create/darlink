name: ChatGPT GV OpenCC 2009

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Install conversion dependency
        run: python -m pip install --quiet opencc-python-reimplemented

      - name: Fetch and convert 2009 Global Voices posts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from opencc import OpenCC

          base = 'https://zhs.globalvoices.org/wp-json/wp/v2/posts'
          posts=[]; page=1; total_pages=None
          while True:
              params={
                  'after':'2009-01-01T00:00:00',
                  'before':'2010-01-01T00:00:00',
                  'per_page':100,
                  'page':page,
                  '_fields':'id,date,link,slug,title,content,author',
              }
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 corpus-research/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  batch=json.loads(r.read().decode('utf-8'))
                  if total_pages is None:
                      total_pages=int(r.headers.get('X-WP-TotalPages','1'))
              posts.extend(batch)
              if page>=total_pages: break
              page+=1

          cc=OpenCC('t2s')
          for p in posts:
              p['title']['rendered']=cc.convert(p['title']['rendered'])
              p['content']['rendered']=cc.convert(p['content']['rendered'])
          with open('globalvoices_2009_posts_simplified.json','w',encoding='utf-8') as f:
              json.dump(posts,f,ensure_ascii=False,indent=2)
          print('converted',len(posts),'posts')
          if len(posts)<1000:
              raise SystemExit('unexpectedly few posts')
          PY

      - name: Upload converted data
        uses: actions/upload-artifact@v4
        with:
          name: globalvoices-2009-simplified
          path: globalvoices_2009_posts_simplified.json
          retention-days: 1
