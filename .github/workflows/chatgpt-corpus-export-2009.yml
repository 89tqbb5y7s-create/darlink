name: ChatGPT Corpus 2009 Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public CoolShell archive
        run: git clone --depth 1 https://github.com/ghostincoolshell/haoel-articles.git source

      - name: Package 2009 Markdown source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/2009_markdown
          find source/blogs/rss2html2markdown -maxdepth 1 -type f -name '2009-*.md' -print0 \
            | xargs -0 -I{} cp '{}' export/2009_markdown/
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('export/2009_markdown').glob('*.md'))
          Path('export/FILE_LIST.txt').write_text('\n'.join(p.name for p in files) + '\n', encoding='utf-8')
          print(f'packaged {len(files)} files')
          if len(files) < 100:
              raise SystemExit('unexpectedly few 2009 files')
          PY
          (cd export && zip -q -r ../coolshell-2009-markdown.zip .)

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: coolshell-2009-markdown
          path: coolshell-2009-markdown.zip
          retention-days: 1
