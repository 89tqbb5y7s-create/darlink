name: Build 2007 Nonpolicy Corpus

on:
  push:
    branches:
      - corpus-2007-nonpolicy-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out builder branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Build corpus payload
        run: python tools/build_2007_nonpolicy_corpus.py
      - name: Upload corpus payload
        uses: actions/upload-artifact@v4
        with:
          name: 2007-O-nonpolicy-payload
          path: corpus_build
          if-no-files-found: error
          retention-days: 3
